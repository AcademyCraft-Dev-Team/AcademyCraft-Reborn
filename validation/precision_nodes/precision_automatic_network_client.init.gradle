// One real integrated client, real packet handlers, disposable copied world only.
allprojects {
    afterEvaluate {
        def directory = rootProject.file(providers.gradleProperty('academySubLevelSmokeDirectory')
                .getOrElse('run/native-sublevel-direct-smoke-precision-automatic-network-baseline')).canonicalFile
        if (!directory.toPath().startsWith(rootProject.file('run').canonicalFile.toPath())
                || !directory.name.startsWith('native-sublevel-direct-smoke')) {
            throw new GradleException('Network smoke requires an isolated run/native-sublevel-direct-smoke* directory')
        }
        neoForge.runs.named('clientDev') {
            gameDirectory.set(directory)
            systemProperty 'academy.precisionAutomaticNetworkSmoke', 'true'
            systemProperty 'academy.precisionAutomaticNetworkStage', providers.gradleProperty('academyPrecisionAutomaticNetworkStage').getOrElse('baseline')
            systemProperty 'academy.precisionPerformanceSmoke', 'false'
            systemProperty 'academy.precisionLearningPathSmoke', 'false'
            systemProperty 'academy.precisionPresentationSmoke', 'false'
            programArguments.addAll('--width', '1600', '--height', '900', '--quickPlaySingleplayer', 'test')
        }
    }
}
