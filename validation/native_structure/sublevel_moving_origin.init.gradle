allprojects {
    afterEvaluate {
        def smokeDirectory = rootProject.file(providers.gradleProperty('academyMovingOriginDirectory')
                .getOrElse('run/native-sublevel-moving-origin-r1')).canonicalFile
        if (!smokeDirectory.toPath().startsWith(rootProject.file('run').canonicalFile.toPath())
                || !smokeDirectory.name.startsWith('native-sublevel-moving-origin-')) {
            throw new GradleException('Moving-origin validation requires an isolated run/native-sublevel-moving-origin-* directory')
        }
        neoForge.runs.named('clientDev') {
            gameDirectory.set(smokeDirectory)
            systemProperty 'academy.sublevelMovingOriginSmoke', 'true'
            programArguments.addAll('--width', '1280', '--height', '720', '--quickPlaySingleplayer', 'test')
        }
    }
}
