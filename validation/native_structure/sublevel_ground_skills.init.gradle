// Reproduce the test-world ground case without changing the user's original save.
allprojects {
    afterEvaluate {
        def smokeDirectory = rootProject.file(providers.gradleProperty('academySubLevelSmokeDirectory')
                .getOrElse('run/native-sublevel-direct-smoke-ground')).canonicalFile
        if (!smokeDirectory.toPath().startsWith(rootProject.file('run').canonicalFile.toPath())
                || !smokeDirectory.name.startsWith('native-sublevel-direct-smoke')) {
            throw new GradleException('Ground smoke must use an isolated run/native-sublevel-direct-smoke* directory')
        }
        neoForge.runs.named('clientDev') {
            gameDirectory.set(smokeDirectory)
            systemProperty 'academy.sublevelGroundSmoke', 'true'
            programArguments.addAll('--width', '1280', '--height', '720', '--quickPlaySingleplayer', 'test')
        }
    }
}
