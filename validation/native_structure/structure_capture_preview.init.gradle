// Public capture preview/binding API fixture, using actual transactions in an isolated save.
allprojects {
    afterEvaluate {
        def smokeDirectory = rootProject.file(providers.gradleProperty('academySubLevelSmokeDirectory')
                .getOrElse('run/native-sublevel-direct-smoke-capture-preview')).canonicalFile
        if (!smokeDirectory.toPath().startsWith(rootProject.file('run').canonicalFile.toPath())
                || !smokeDirectory.name.startsWith('native-sublevel-direct-smoke')) {
            throw new GradleException('Capture preview smoke requires an isolated run/native-sublevel-direct-smoke* directory')
        }
        neoForge.runs.named(providers.gradleProperty('academyStructureCapturePreviewRun').getOrElse('clientDev')) {
            gameDirectory.set(smokeDirectory)
            systemProperty 'academy.structureCapturePreviewSmoke', 'true'
            systemProperty 'academy.structureCapturePreviewDisconnected',
                    providers.gradleProperty('academyCapturePreviewDisconnected').getOrElse('false')
            programArguments.addAll('--width', '1280', '--height', '720', '--quickPlaySingleplayer', 'test')
        }
    }
}
