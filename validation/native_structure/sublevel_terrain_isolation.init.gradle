// Reuses an isolated copy of the saved test2 scene; never edits the original world.
allprojects {
    afterEvaluate {
        def smokeDirectory = rootProject.file(providers.gradleProperty('academySubLevelTerrainIsolationDirectory')
                .getOrElse('run/native-sublevel-terrain-isolation-test2')).canonicalFile
        if (!smokeDirectory.toPath().startsWith(rootProject.file('run').canonicalFile.toPath())
                || !smokeDirectory.name.startsWith('native-sublevel-terrain-isolation-')) {
            throw new GradleException('Terrain isolation smoke requires an isolated run/native-sublevel-terrain-isolation-* directory')
        }
        neoForge.runs.named('clientDev') {
            gameDirectory.set(smokeDirectory)
            systemProperty 'academy.sublevelTerrainIsolationSmoke', 'true'
            programArguments.addAll('--width', '1280', '--height', '720', '--quickPlaySingleplayer',
                    providers.gradleProperty('academySubLevelTerrainIsolationWorld').getOrElse('test2'))
        }
    }
}
