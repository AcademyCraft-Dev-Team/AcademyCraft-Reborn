allprojects {
    afterEvaluate {
        def smokeDirectory = new File(rootProject.projectDir, 'run/native-sublevel-multi-smoke').canonicalFile
        neoForge.runs.named('clientDev') {
            gameDirectory.set(smokeDirectory)
            systemProperty 'academy.sublevelMultiSmoke', 'true'
            programArguments.addAll('--width', '1280', '--height', '720',
                    '--quickPlaySingleplayer', 'Native SubLevel Multi Smoke')
        }
    }
}
