allprojects {
    afterEvaluate {
        def smokeDirectory = rootProject.file(providers.gradleProperty('academySubLevelSmokeDirectory')
                .getOrElse('run/native-sublevel-direct-smoke')).canonicalFile
        if (!smokeDirectory.toPath().startsWith(rootProject.file('run').canonicalFile.toPath())
                || !smokeDirectory.name.startsWith('native-sublevel-direct-smoke')) {
            throw new GradleException('SubLevel skill smoke must use run/native-sublevel-direct-smoke*')
        }
        neoForge.runs.named('clientDev') {
            gameDirectory.set(smokeDirectory)
            systemProperty 'academy.sublevelClientSmoke', 'true'
            systemProperty 'academy.sublevel.clientCollision', 'false'
            systemProperty 'academy.sublevel.programChainProbe', providers.gradleProperty('academySubLevelProgramChainProbe').getOrElse('true')
            systemProperty 'academy.sublevel.controlMatrixProbe', 'true'
            systemProperty 'academy.sublevelProgramNodes', 'true'
            systemProperty 'academy.sublevelDirectSkills', 'true'
            programArguments.addAll('--width', '1280', '--height', '720',
                    '--quickPlaySingleplayer', 'Native SubLevel Direct Smoke')
        }
    }
}
