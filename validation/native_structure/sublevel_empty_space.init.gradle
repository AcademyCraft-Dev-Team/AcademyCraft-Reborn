allprojects {
    afterEvaluate {
        def smokeDirectory = rootProject.file(providers.gradleProperty('academyEmptySpaceDirectory')
                .getOrElse('run/native-sublevel-empty-space-r1')).canonicalFile
        if (!smokeDirectory.toPath().startsWith(rootProject.file('run').canonicalFile.toPath())
                || !smokeDirectory.name.startsWith('native-sublevel-empty-space-')) {
            throw new GradleException('Empty-space validation requires an isolated run/native-sublevel-empty-space-* directory')
        }
        neoForge.runs.named('clientDev') {
            gameDirectory.set(smokeDirectory)
            systemProperty 'academy.sublevelEmptySpaceSmoke', 'true'
            programArguments.addAll('--width', '1280', '--height', '720', '--quickPlaySingleplayer', 'test')
        }
    }
}
