// Reuse real three-category extraction/control/orientation graphs with point/set selectors.
apply from: new File(initscript.sourceFile.parentFile, 'structure_program_orientation.init.gradle')
allprojects {
    afterEvaluate {
        neoForge.runs.named(providers.gradleProperty('academyStructureOrientationRun').getOrElse('clientDev')) {
            systemProperty 'academy.structureSelectionSmoke', 'true'
        }
    }
}
