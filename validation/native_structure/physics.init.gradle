allprojects {
    afterEvaluate {
        def mode = providers.gradleProperty('academyNativePhysicsSmoke').orNull
        if (!(mode in ['client', 'server'])) {
            throw new GradleException('Choose -PacademyNativePhysicsSmoke=client or =server')
        }
        def runRoot = rootProject.file('run').canonicalFile
        def directory = rootProject.file(providers.gradleProperty('academyNativePhysicsSmokeDirectory')
                .getOrElse("run/native-physics-smoke-${mode}")).canonicalFile
        if (!directory.toPath().startsWith(runRoot.toPath()) || !directory.isDirectory()
                || !directory.name.startsWith("native-physics-smoke-${mode}")) {
            throw new GradleException('Prepare an isolated run/native-physics-smoke-' + mode + '* directory')
        }
        def library = providers.gradleProperty('academyNativePhysicsLibrary').orNull
        def manifest = providers.gradleProperty('academyNativePhysicsManifest').orNull
        if (library == null || manifest == null || !new File(library).isAbsolute() || !new File(manifest).isAbsolute()) {
            throw new GradleException('Pass explicit absolute academyNativePhysicsLibrary and academyNativePhysicsManifest paths')
        }
        if (java.nio.file.Files.exists(new File(directory, "native-physics-${mode}-result.txt").toPath(),
                java.nio.file.LinkOption.NOFOLLOW_LINKS)) {
            throw new GradleException('Use a fresh smoke directory; an earlier result must not be overwritten')
        }
        if (mode == 'server') {
            def world = new File(directory, 'native-physics-smoke')
            if (java.nio.file.Files.exists(world.toPath(), java.nio.file.LinkOption.NOFOLLOW_LINKS)
                    || world.canonicalFile.toPath() != world.toPath()) {
                throw new GradleException('Physics server requires a new literal native-physics-smoke world path without existing files or links')
            }
            if (java.nio.file.Files.exists(new File(directory, 'native-physics-server-exit.txt').toPath(),
                    java.nio.file.LinkOption.NOFOLLOW_LINKS)) {
                throw new GradleException('Use a fresh physics server directory; an earlier exit marker must not be overwritten')
            }
            def eula = new File(directory, 'eula.txt')
            def settingsFile = new File(directory, 'server.properties')
            if (!eula.isFile() || !(eula.text =~ /(?m)^eula=true\s*$/).find() || !settingsFile.isFile()) {
                throw new GradleException('Prepare the isolated server with an already accepted EULA and server.properties')
            }
            def settings = new Properties()
            settingsFile.withInputStream { settings.load(it) }
            if (settings.getProperty('level-name') != 'native-physics-smoke'
                    || settings.getProperty('server-ip') != '127.0.0.1') {
                throw new GradleException('Physics server must bind 127.0.0.1 and use level-name=native-physics-smoke')
            }
        }
        def runName = mode == 'client' ? 'clientDev' : 'serverCompat'
        neoForge.runs.named(runName) {
            gameDirectory.set(directory)
            systemProperty 'academy.nativePhysicsSmoke', mode
            systemProperty 'academy.nativePhysicsSmokeDirectory', directory.absolutePath
            systemProperty 'academy.nativePhysicsSmokeRunRoot', runRoot.absolutePath
            systemProperty 'academy.nativePhysics.library', library
            systemProperty 'academy.nativePhysics.manifest', manifest
            jvmArgument '--enable-native-access=ALL-UNNAMED'
            if (mode == 'client') programArguments.addAll('--width', '960', '--height', '540')
        }
        tasks.named(mode == 'client' ? 'runClientDev' : 'runServerCompat') {
            notCompatibleWithConfigurationCache('Physics smoke must revalidate its isolated directory and fresh world before every launch')
            dependsOn 'prepareNativePhysics'
        }
    }
}
