// Production routing and collision defaults: this fixture sets no feature-enabling flags.
allprojects {
    afterEvaluate {
        def smokeDirectory = rootProject.file(providers.gradleProperty('academySubLevelSmokeDirectory')
                .getOrElse('run/native-sublevel-direct-smoke-default')).canonicalFile
        if (!smokeDirectory.toPath().startsWith(rootProject.file('run').canonicalFile.toPath())
                || !smokeDirectory.name.startsWith('native-sublevel-direct-smoke')) {
            throw new GradleException('SubLevel smoke must use an isolated run/native-sublevel-direct-smoke* directory')
        }
        neoForge.runs.named('clientDev') {
            gameDirectory.set(smokeDirectory)
            systemProperty 'academy.sublevelClientSmoke', 'true'
            systemProperty 'academy.sublevel.controlMatrixProbe', 'true'
            systemProperty 'academy.sublevel.defaultPathProbe', 'true'
            systemProperty 'academy.sublevel.restoreProbe', providers.gradleProperty('academySubLevelRestoreProbe').getOrElse('false')
            programArguments.addAll('--width', '1280', '--height', '720', '--quickPlaySingleplayer',
                    providers.gradleProperty('academySubLevelSmokeWorld').getOrElse('test'))
        }
    }
}
