allprojects {
    afterEvaluate {
        def game = rootProject.file(providers.gradleProperty('academySubLevelSmokeDirectory').get()).canonicalFile
        if (!game.toPath().startsWith(rootProject.file('run').canonicalFile.toPath())
                || !game.name.startsWith('native-sublevel-direct-smoke')) throw new GradleException('Isolated growth fixture required')
        neoForge.runs.named('clientDev') {
            gameDirectory.set(game)
            systemProperty 'academy.sublevelGrowthSmoke', providers.gradleProperty('academyGrowthMode').getOrElse('prepare')
            programArguments.addAll('--quickPlaySingleplayer', 'test', '--width', '1280', '--height', '720')
        }
    }
}
