allprojects {
    afterEvaluate {
        def stage = providers.gradleProperty('academyStructurePhysicsRegions').orNull
        if (!(stage in ['prepare', 'resume'])) throw new GradleException('Choose -PacademyStructurePhysicsRegions=prepare or resume')
        def runRoot = rootProject.file('run').canonicalFile
        def directory = rootProject.file(providers.gradleProperty('academyStructurePhysicsRegionsDirectory')
                .getOrElse('run/native-structure-physics-regions-server')).canonicalFile
        if (!directory.isDirectory() || !directory.toPath().startsWith(runRoot.toPath())
                || !directory.name.startsWith('native-structure-physics-regions-')) {
            throw new GradleException('Prepare an isolated run/native-structure-physics-regions-* directory')
        }
        def exists = { File file -> java.nio.file.Files.exists(file.toPath(), java.nio.file.LinkOption.NOFOLLOW_LINKS) }
        def result = { String value -> new File(directory, "native-physics-regions-${value}-result.txt") }
        def exit = { String value -> new File(directory, "native-physics-regions-${value}-exit.txt") }
        if (exists(result(stage)) || exists(exit(stage))) throw new GradleException('Each region probe stage needs fresh immutable result and exit paths')
        def world = new File(directory, 'native-structure-physics-regions-smoke')
        def checkpoint = new File(directory, 'regions-checkpoint.nbt')
        if (world.canonicalFile.toPath() != world.toPath()) throw new GradleException('Region probe world must not resolve through links')
        if (stage == 'prepare') {
            if (exists(world) || exists(checkpoint)) throw new GradleException('Prepare requires a previously nonexistent world and checkpoint path')
            for (def value : ['prepare', 'resume']) {
                if (exists(result(value)) || exists(exit(value))) throw new GradleException('Prepare requires a fresh experiment directory')
            }
        } else {
            if (!new File(world, 'level.dat').isFile() || !checkpoint.isFile()) throw new GradleException('Resume requires the same isolated prepare world')
            if (!result('prepare').isFile() || !exit('prepare').isFile()
                    || !result('prepare').text.startsWith('PASSED\n')
                    || !exit('prepare').text.contains('exit_status=0\n')
                    || !exit('prepare').text.contains('stopping_guards_verified=true\n')) {
                throw new GradleException('Prepare must pass and terminate after normal saving and stopping guard checks')
            }
        }
        def eula = new File(directory, 'eula.txt')
        def settingsFile = new File(directory, 'server.properties')
        if (!eula.isFile() || !(eula.text =~ /(?m)^eula=true\s*$/).find() || !settingsFile.isFile()) {
            throw new GradleException('Prepare accepted EULA and isolated server.properties before launching')
        }
        def settings = new Properties()
        settingsFile.withInputStream { settings.load(it) }
        if (settings.getProperty('level-name') != 'native-structure-physics-regions-smoke'
                || settings.getProperty('server-ip') != '127.0.0.1'
                || settings.getProperty('pause-when-empty-seconds') != '0') {
            throw new GradleException('Use level-name=native-structure-physics-regions-smoke, server-ip=127.0.0.1, pause-when-empty-seconds=0')
        }
        def library = providers.gradleProperty('academyNativePhysicsLibrary').orNull
        def manifest = providers.gradleProperty('academyNativePhysicsManifest').orNull
        if (library == null || manifest == null || !new File(library).isAbsolute() || !new File(manifest).isAbsolute()) {
            throw new GradleException('Pass explicit absolute academyNativePhysicsLibrary and academyNativePhysicsManifest')
        }
        neoForge.runs.named('serverCompat') {
            gameDirectory.set(directory)
            systemProperty 'academy.nativeStructurePhysicsRegionsSmoke', 'true'
            systemProperty 'academy.nativeStructurePhysicsRegionsStage', stage
            systemProperty 'academy.nativeStructurePhysicsRegionsDirectory', directory.absolutePath
            systemProperty 'academy.nativeStructurePhysicsRegionsRunRoot', runRoot.absolutePath
            systemProperty 'academy.nativePhysics.library', library
            systemProperty 'academy.nativePhysics.manifest', manifest
            jvmArgument '--enable-native-access=ALL-UNNAMED'
        }
        tasks.named('runServerCompat') {
            notCompatibleWithConfigurationCache('Multi-region smoke must revalidate isolated world and stage evidence on every launch')
            dependsOn 'prepareNativePhysics'
        }
    }
}
