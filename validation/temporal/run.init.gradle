allprojects {
    afterEvaluate {
        sourceSets.main.java.srcDir(file('validation/temporal/java'))
        neoForge.runs.named('clientDev') {
            gameDirectory.set(file('run/temporal-client-regression'))
            programArguments.addAll('--quickPlaySingleplayer', 'verification', '--width', '960', '--height', '540')
        }
    }
}
