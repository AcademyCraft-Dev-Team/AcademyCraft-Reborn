// Independent opt-in comparison fixture. No production task or gameplay configuration changes.
allprojects {
    afterEvaluate {
        tasks.register('beetlePoseBenchmark', JavaExec) {
            dependsOn tasks.named('editorClasses')
            classpath = sourceSets.editor.runtimeClasspath
            mainClass.set('org.academy.desktop.grapheditor.preview.BeetlePerformanceCaptureMain')
            javaLauncher.set(tasks.named('test').get().javaLauncher)
            systemProperty 'academy.beetlePerformanceLabel', System.getProperty('academy.beetlePerformanceLabel', 'baseline')
            systemProperty 'academy.beetlePerformanceOutput', file('docs/models/darkmatter_creature/performance').absolutePath
        }
        neoForge.runs.named('clientDev') {
            sourceSet.set(sourceSets.editor)
            gameDirectory.set(file('run/ability-vfx'))
            systemProperty 'academy.beetlePerformanceSmoke', 'true'
            systemProperty 'academy.beetlePerformanceLabel', System.getProperty('academy.beetlePerformanceLabel', 'baseline')
            systemProperty 'academy.beetlePerformanceCombat', System.getProperty('academy.beetlePerformanceCombat', 'false')
            systemProperty 'academy.beetlePerformanceClearCamera', System.getProperty('academy.beetlePerformanceClearCamera', 'false')
            systemProperty 'academy.beetlePerformanceOutput', file('docs/models/darkmatter_creature/performance').absolutePath
            programArguments.addAll('--width', '1280', '--height', '720')
        }
    }
}
