// One real renderer with neutral multi-subject VFX anchors; not eighteen network clients.
allprojects {
    afterEvaluate {
        neoForge.runs.named('clientDev') {
            sourceSet.set(sourceSets.editor)
            gameDirectory.set(file('run/ability-vfx'))
            systemProperty 'academy.darkmatterPerformanceSmoke', 'true'
            systemProperty 'academy.darkmatterPerformanceLabel', System.getProperty('academy.darkmatterPerformanceLabel', 'baseline')
            systemProperty 'academy.darkmatterPerformanceOutput', file('docs/vfx/darkmatter_concept_v2/runtime/performance').absolutePath
            programArguments.addAll('--width', '1280', '--height', '720')
        }
    }
}
