allprojects {
    afterEvaluate {
        extensions.getByName('kotlin').sourceSets.named('editor') {
            kotlin.srcDir(rootProject.file('docs/vfx/darkmatter_concept_v2/runtime'))
        }
        neoForge.runs.named('graphEditor') {
            systemProperty 'academy.desktop.main', 'org.academy.desktop.grapheditor.preview.DarkmatterConceptCaptureMainKt'
            systemProperty 'academy.darkmatterCaptureAssets', 'six_wings,feather,wing_strike,cut'
            systemProperty 'academy.darkmatterCaptureOutput', 'docs/vfx/darkmatter_concept_v2/runtime/wings_revision'
        }
        neoForge.runs.named('clientDev') {
            sourceSet.set(sourceSets.editor)
            gameDirectory.set(file('run/ability-vfx'))
            systemProperty 'academy.sixWingsBlockSmoke', 'true'
            systemProperty 'academy.sixWingsBlockOutput', file('docs/vfx/darkmatter_concept_v2/runtime/wings_revision/gameplay').absolutePath
            programArguments.addAll('--width', '1280', '--height', '720')
        }
    }
}
