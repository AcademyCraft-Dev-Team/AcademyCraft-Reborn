// Isolated approved-concept capture. Run from the repository root with runClientDev.
allprojects {
    afterEvaluate {
        neoForge.runs.named('clientDev') {
            sourceSet.set(sourceSets.editor)
            gameDirectory.set(file('run/ability-vfx'))
            systemProperty 'academy.darkmatterConceptSmoke', 'true'
            systemProperty 'academy.darkmatterConceptOutput', file('docs/vfx/darkmatter_concept_v2/runtime').absolutePath
            programArguments.addAll('--width', '1280', '--height', '720')
        }
    }
}
