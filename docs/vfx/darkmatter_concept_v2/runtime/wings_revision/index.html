body{margin:0;background:#101216;color:#e4e6e9;font:16px/1.6 system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:28px}h1{font-size:26px;font-weight:600}p{color:#aeb5bf}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{background:#20252c;border:1px solid #525b67;color:inherit;padding:9px 16px;cursor:pointer}button[aria-pressed=true]{background:#dae1eb;color:#111}section{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0}img{width:100%;background:#20242a;display:block}figcaption{padding:8px 0;color:#b9c1cc}.concept{max-width:1000px;margin:32px auto}small{color:#aeb5bf}@media(max-width:800px){section{grid-template-columns:1fr}}

<main>
<h1>未元物质 · 六翼形态对照</h1>
<p>弧形翼缘、展开主羽和交错覆羽。以下效果图来自项目渲染器及游戏客户端。</p>
<nav id="views"></nav>
<section><figure><img id="before" alt="优化前"><figcaption>优化前 · 本地提交 520ced48</figcaption></figure><figure><img id="after" alt="本轮实际效果"><figcaption>本轮实际效果</figcaption></figure></section>
<p id="note"></p>
<figure class="concept"><img src="../../09_six_wings.png" alt="六翼概念方案"><figcaption>原概念方案 · 用于比较翼面轮廓和羽片层次</figcaption></figure>
<small>中性人形为编辑器尺度参照。方块阻隔、玩家锚点以游戏视图为准。</small>
</main>
<script>
const views=[
 ['游戏正面','../wings_block/angles_open.png','gameplay/angles_open.png','站立：检查三对间距、完整翼面与脚边净空。'],
 ['编辑器站姿','../gpu_darkmatter_six_wings_gamma.png','gpu_darkmatter_six_wings_gamma.png','同一相态和镜头，观察前缘弧线、尾缘长羽及覆羽层次。'],
 ['飞行','../gpu_darkmatter_six_wings_gamma_flight.png','gpu_darkmatter_six_wings_gamma_flight.png','飞行姿态保留三对张角，下翼自由展开。'],
 ['侧面','../gpu_darkmatter_six_wings_gamma_yaw_65.png','gpu_darkmatter_six_wings_gamma_yaw_65.png','偏转 65°，观察羽片厚度和重叠关系。'],
 ['局部阻隔','../wings_block/wall_blocked.png','gameplay/wall_blocked.png','真实方块碰撞：只裁短受阻翼面。'],
 ['可控穿透','../wings_block/wall_partial.png','gameplay/wall_partial.png','同一墙面，穿透参数 0.35。'],
 ['羽刃','../gpu_darkmatter_feather_alpha_fit.png','gpu_darkmatter_feather_alpha_fit.png','共享羽毛材质：减弱重复细纹，加强长渐尖轮廓。'],
 ['远距','../gpu_darkmatter_six_wings_gamma_lod_far.png','gpu_darkmatter_six_wings_gamma_lod_far.png','85 米视图：检查减少覆羽后主轮廓是否仍然完整。']
];
function select(i){const v=views[i];document.querySelector('#before').src=v[1];document.querySelector('#after').src=v[2];document.querySelector('#note').textContent=v[3];document.querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-pressed',j===i));}
views.forEach((v,i)=>{const b=document.createElement('button');b.textContent=v[0];b.onclick=()=>select(i);document.querySelector('#views').append(b);});select(0);
</script>
