// Opt-in v3 validation sources, excluded from production source sets and release jars.
allprojects {
    afterEvaluate {
        extensions.getByName('kotlin').sourceSets.named('editor') {
            kotlin.srcDir(rootProject.file('docs/vfx/darkmatter_reconstruction_v3/runtime'))
        }
        sourceSets.editor.java.srcDir(rootProject.file('docs/vfx/darkmatter_reconstruction_v3/runtime'))
        neoForge.runs.named('graphEditor') {
            systemProperty 'academy.desktop.main', 'org.academy.desktop.grapheditor.preview.DarkmatterReconstructionCaptureMainKt'
            systemProperty 'academy.reconstructionOutput', file('docs/vfx/darkmatter_reconstruction_v3/runtime/editor').absolutePath
        }
        neoForge.runs.named('clientDev') {
            sourceSet.set(sourceSets.editor)
            gameDirectory.set(file('run/ability-vfx'))
            systemProperty 'academy.reconstructionSmoke', 'true'
            systemProperty 'academy.reconstructionOutput', file('docs/vfx/darkmatter_reconstruction_v3/runtime/gameplay').absolutePath
            programArguments.addAll('--width', '1280', '--height', '720')
        }
    }
}
