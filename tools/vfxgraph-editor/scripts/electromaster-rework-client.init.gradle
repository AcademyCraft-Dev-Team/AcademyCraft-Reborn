allprojects {
    afterEvaluate {
        neoForge.runs.named('clientDev') {
            sourceSet.set(sourceSets.editor)
            gameDirectory.set(file('run/electromaster-rework'))
            systemProperty 'academy.electromasterReworkSmoke', 'true'
            systemProperty 'academy.electromasterReworkOutput', file('build/rework-client-captures').absolutePath
            programArguments.addAll('--width', '1280', '--height', '720')
        }
    }
}
