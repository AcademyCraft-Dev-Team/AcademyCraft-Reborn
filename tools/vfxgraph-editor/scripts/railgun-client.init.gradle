allprojects {
    afterEvaluate {
        neoForge.runs.named('clientDev') {
            sourceSet.set(sourceSets.editor)
            gameDirectory.set(file('run/railgun-client'))
            systemProperty 'academy.railgunSmoke', 'true'
            systemProperty 'academy.railgunSmokeOutput', file('docs/vfx/railgun').absolutePath
            programArguments.addAll('--width', '1280', '--height', '720')
        }
    }
}
