allprojects {
    afterEvaluate {
        neoForge.runs.named('clientDev') {
            sourceSet.set(sourceSets.editor)
            gameDirectory.set(file('run/ability-vfx'))
            systemProperty 'academy.darkmatterVfxSmoke', 'true'
            systemProperty 'academy.darkmatterVfxOutput', file('docs/vfx/darkmatter_redesign').absolutePath
            programArguments.addAll('--width', '1280', '--height', '720')
        }
    }
}
