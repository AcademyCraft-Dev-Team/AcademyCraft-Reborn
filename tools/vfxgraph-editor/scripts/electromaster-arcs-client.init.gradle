allprojects {
    afterEvaluate {
        neoForge.runs.named('clientDev') {
            sourceSet.set(sourceSets.editor)
            gameDirectory.set(file('run/electromaster-arcs'))
            systemProperty 'academy.electromasterArcsSmoke', 'true'
            systemProperty 'academy.electromasterArcsOutput', file('docs/vfx/electromaster_arcs').absolutePath
            programArguments.addAll('--width', '1280', '--height', '720')
        }
    }
}
